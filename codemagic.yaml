# Codemagic CI/CD — The Music Cities iOS (Capacitor wrapper of musiccitiesconcerts.com)
#
# One-time setup in Codemagic before the first build:
#   Team settings > Integrations > Developer Portal > Manage keys:
#     App Store Connect API key named EXACTLY:  codemagic_asc
#     (Issuer ID 960b58e5-eeb2-42b9-9212-20f4bd0969d0, Key ID JDY288QGZL,
#      AuthKey_JDY288QGZL.p8). Declaring the integration below exposes the
#      APP_STORE_CONNECT_* env vars to the signing CLI.
#
# Signing is fully automatic: the distribution certificate and the App Store
# provisioning profile are CREATED from that API key on the first build
# (fetch-signing-files --create), since a brand-new app has neither yet.
#
# The native ios/ folder is NOT committed; it is generated fresh each build by
# `npx cap add ios`, then configured for push by scripts/ios-setup-push.mjs.

workflows:
  ios-release:
    name: The Music Cities iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_asc
    environment:
      groups:
        - signing
      vars:
        BUNDLE_ID: "com.themusiccities.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Generate native iOS project
        script: npx cap add ios
      - name: Configure push notifications (entitlement, AppDelegate, scheme)
        script: node scripts/ios-setup-push.mjs
      - name: Sync Capacitor web assets + plugins
        script: npx cap sync ios
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "${BUILD_NUMBER:-1}"
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch/create signing files
        script: |
          # Creating a new distribution certificate needs a private key to pair
          # with it. Reuse one stored as CERTIFICATE_PRIVATE_KEY if present
          # (avoids a new cert each build); otherwise generate one.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          else
            openssl genrsa -out /tmp/cert_key.pem 2048
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
      - name: Add signing certificate to keychain
        script: keychain add-certificates
      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # ---------------------------------------------------------------------------
  # Google Play (Android) — Capacitor wrapper of musiccitiesconcerts.com
  #
  # One-time setup in Codemagic before the first build:
  #   Team settings > Code signing identities > Android keystores:
  #     Upload signing.keystore (PWABuilder) with reference name EXACTLY:  tmc_pwabuilder
  #     Keystore password / key password: (provided separately)
  #     Key alias: my-key-alias
  #   Referencing it below (android_signing) injects CM_KEYSTORE_PATH,
  #   CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD at build time.
  #
  # The native android/ folder is NOT committed; it is generated fresh each
  # build by `npx cap add android`, then configured by scripts/android-setup.mjs
  # (applicationId = com.businessflare.musiccities to match the Play listing,
  # versionCode from $BUILD_NUMBER, and the release signingConfig).
  #
  # Push notifications are intentionally excluded from the Android build (the
  # push plugin is removed before sync) so no Firebase/google-services.json is
  # required. The site's push code no-ops when the plugin is absent.
  #
  # Output: a signed release .aab artifact to upload to Play Console.
  android-release:
    name: The Music Cities Android release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - tmc_pwabuilder
      vars:
        PACKAGE_NAME: "com.businessflare.musiccities"
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Remove push plugin for Android (no Firebase needed)
        script: npm rm @capacitor/push-notifications --no-save || true
      - name: Generate native Android project
        script: npx cap add android
      - name: Configure Android (applicationId, version, signing)
        script: node scripts/android-setup.mjs
      - name: Sync Capacitor web assets + plugins
        script: npx cap sync android
      - name: Build signed release AAB
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo "$JAVA_HOME")
          echo "Using JAVA_HOME=$JAVA_HOME"
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
