<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Music Cities</title>
  <style>
    html,body{height:100%;margin:0;background:#0a0a0a;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:32px;box-sizing:border-box;}
    h1{font-size:22px;letter-spacing:.02em;margin:0 0 8px;}
    p{color:#b3b3b3;font-size:15px;line-height:1.5;margin:0 0 24px;max-width:320px;}
    a{display:inline-block;background:#e50914;color:#fff;text-decoration:none;
      font-weight:700;padding:12px 24px;border-radius:999px;font-size:15px;}
    .spin{width:28px;height:28px;border:3px solid #2a2a2a;border-top-color:#e50914;
      border-radius:50%;animation:s 1s linear infinite;margin-bottom:20px;}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin" aria-hidden="true"></div>
    <h1>The Music Cities</h1>
    <p>Loading the latest concerts, releases, and scene news. If this screen stays, check your connection.</p>
    <a href="https://musiccitiesconcerts.com">Open the site</a>
  </div>
</body>
</html>
